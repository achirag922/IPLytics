# Profile for the one-shot Cricsheet converter (pure file transformation, no database):
#   java -jar iplytics.jar --spring.profiles.active=convert --convert.source=data/cricsheet/ipl_json.zip
spring:
  main:
    web-application-type: none
    banner-mode: off
    lazy-initialization: true # only the converter beans are created
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

convert:
  source: data/cricsheet/ipl_json.zip
  output-dir: data/raw

logging:
  level:
    root: WARN
    com.iplytics: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %msg%n"
