spring:
  application:
    name: iplytics
  datasource:
    # Local-dev defaults match docker-compose.yml; override via environment variables.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iplytics}
    username: ${DB_USER:iplytics}
    password: ${DB_PASSWORD:iplytics}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
