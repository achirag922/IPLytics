# Local development infrastructure. V0/V1: PostgreSQL only.
# Values come from .env (copy .env.example); defaults match backend/src/main/resources/application.yml.
name: iplytics

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-iplytics}
      POSTGRES_USER: ${DB_USER:-iplytics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iplytics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
