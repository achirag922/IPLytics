spring:
  application:
    name: iplytics
  datasource:
    # Local-dev defaults match docker-compose.yml; override via environment variables.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iplytics}
    username: ${DB_USER:iplytics}
    password: ${DB_PASSWORD:iplytics}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # never env, configprops, beans, heapdump, loggers
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    build:
      enabled: true
    java:
      enabled: true
    env:
      enabled: false
    os:
      enabled: false

iplytics:
  cors:
    # Comma-separated browser origins allowed to call /api/** (the Vite dev server by default).
    allowed-origins: ${IPLYTICS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  pattern:
    # requestId comes from RequestLoggingFilter (X-Request-Id) for API requests.
    level: "%5p [%X{requestId:-}]"

springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
